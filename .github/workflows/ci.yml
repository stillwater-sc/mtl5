name: CI

on:
  push:
    branches: [ '**' ]
    tags: [ 'v[0-9]*' ]
  pull_request:
    branches: [ main ]
    # `ready_for_review` matters: the Tier 2 regression job gates on
    # `pull_request.draft == false`, so a PR opened as a draft only ever has
    # runs in which that job skipped. Without this trigger, promoting the draft
    # re-evaluates nothing and Tier 2 never runs unless another commit is
    # pushed -- and `gh pr checks` still reports green, because a skipped job
    # is not a failure (#333).
    #
    # The other three are the defaults, and must be listed explicitly: naming
    # `types` REPLACES the default set rather than extending it.
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  # -- ASCII guard: source files must contain only ASCII bytes ---------
  # Fails fast if any C++ source under include/, tests/, examples/
  # introduces non-ASCII (multibyte) characters.
  ascii-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for non-ASCII characters in source
        run: |
          # grep -l exits 0 (matches), 1 (no matches), >1 (execution error).
          # Don't mask >1 with '|| true' — a broken scan must fail CI, not pass.
          set +e
          hits=$(grep -rlP '[^\x00-\x7F]' \
            --include='*.hpp' --include='*.cpp' --include='*.h' \
            --include='*.cc' --include='*.cxx' \
            include tests examples)
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "ASCII scan failed to execute (grep exit $status)."
            exit "$status"
          fi
          if [ -n "$hits" ]; then
            echo "Non-ASCII characters found in:"
            echo "$hits"
            echo "Source files must be ASCII-only. See CONTRIBUTING / issue #59."
            exit 1
          fi
          echo "OK: all source files are ASCII-only."

  # Every committed CSV must carry its .sysinfo (#477). A benchmark result
  # without provenance cannot be traced to a commit, a build configuration or a
  # machine state -- 28 such files reached the repository before anyone noticed,
  # and they were found by auditing an open issue rather than by anything
  # failing. Those are grandfathered in benchmarks/data/.sidecar-exempt; this
  # job forbids adding another, and also fails on a stale exemption so the list
  # cannot rot into a permanent amnesty.
  sidecar-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every committed CSV has a provenance sidecar
        run: benchmarks/check_sidecars.sh

  # -- Tier 1: Fast unit tests on all platforms (~2 min) ---------------
  # Runs on every push and every PR (draft or ready).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            name: Linux x64 (GCC 13)

          - os: ubuntu-24.04
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            name: Linux x64 (Clang 18)

          # ── Linux ARM64 ───────────────────────────────────────────────
          - os: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            name: Linux ARM64 (GCC 13)

          - os: ubuntu-24.04-arm
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            name: Linux ARM64 (Clang 18)

          # ── macOS ARM64 (Apple Silicon) ───────────────────────────────
          - os: macos-14
            compiler: apple-clang
            cc: clang
            cxx: clang++
            name: macOS ARM64 (Apple Clang)

          - os: macos-15
            compiler: apple-clang
            cc: clang
            cxx: clang++
            name: macOS ARM64 (Apple Clang, latest)

          # ── Windows x86_64 ────────────────────────────────────────────
          - os: windows-2022
            compiler: msvc
            name: Windows x64 (MSVC 2022)

          - os: windows-2022
            compiler: clang-cl
            name: Windows x64 (Clang-CL)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # Use sccache (and its GitHub Actions cache) only on trusted runs: pushes
    # and same-repo PRs. Forked PRs leave it empty so they never write to the
    # shared GHA cache (zizmor cache-poisoning). An empty launcher == no launcher.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure (Unix, GCC/Clang)
        if: runner.os != 'Windows'
        run: >
          cmake -B build
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows, MSVC)
        if: matrix.compiler == 'msvc'
        run: >
          cmake -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}

      - name: Configure (Windows, Clang-CL)
        if: matrix.compiler == 'clang-cl'
        run: >
          cmake -B build
          -G "Visual Studio 17 2022" -A x64
          -T ClangCL
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel 2

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

  # -- LAPACK/BLAS-enabled build: exercises the geev/syev dispatch -----
  # Linux GCC + Clang with -DMTL5_WITH_LAPACK=ON so the external-library
  # dispatch paths (general geev, symmetric syev) are compiled and run; the
  # default matrix above builds without LAPACK and takes the in-house paths.
  lapack:
    name: Linux x64 LAPACK (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc-13
            cxx: g++-13
          - cc: clang-18
            cxx: clang++-18

    # Same trusted-run gate as the build job: forked PRs skip sccache so they
    # cannot poison the shared GHA cache.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install LAPACK/BLAS
        run: sudo apt-get update && sudo apt-get install -y liblapack-dev libopenblas-dev

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release
          -DMTL5_WITH_LAPACK=ON
          -DMTL5_WITH_BLAS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # -- Threaded lane: run the suite with the pool actually multithreaded ----
  # Same Release build as the default job, but ctest runs with
  # MTL5_NUM_THREADS=4 so detail::thread_pool sizes to a real team and the
  # pool-based kernels (mult/gemv/dot/nrm2/axpy/scal, sparse SpMV, the dense
  # factorization updates, Householder application, sparse triangular solve)
  # actually run multithreaded -- the default job runs them serial. The
  # deterministic kernels are bit-identical across thread counts, so pass/fail
  # must match serial; a divergence is a real race/chunking bug this lane
  # surfaces. Runs on every push and PR (incl. drafts), like the build job. (#299)
  threaded:
    name: Linux x64 threaded (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc-13
            cxx: g++-13
          - cc: clang-18
            cxx: clang++-18

    # Same trusted-run gate as the build job: forked PRs skip sccache so they
    # cannot poison the shared GHA cache.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test (MTL5_NUM_THREADS=4)
        run: ctest --test-dir build --output-on-failure
        env:
          MTL5_NUM_THREADS: 4

  # -- Fixed-baseline FP-contraction lane ----------------------------------
  # No other test lane compiles with an elevated ISA baseline, so no test lane
  # enables FP contraction -- while the release preset and the benchmark lanes
  # do. The configuration a performance-minded user is most likely to build is
  # the one the suite never ran in, and #381 was found by hand because of it.
  #
  # x86-64-v3 (AVX2 + FMA), NOT -march=native. native would pin the build to
  # whatever microarchitecture the runner happens to be, so a red result would
  # not be reproducible; v3 is a fixed target that still enables the contraction
  # this lane exists to exercise. Verified equivalent for the purpose: with the
  # #381 contraction pin removed, v3 reproduces that failure exactly -- 4
  # assertions in trisolve_level_schedule_mt and 1 in supernodal_ldlt_mt, the
  # same counts -march=native gives.
  #
  # Release, because contraction is an optimizer transformation and -O0 would
  # not exercise it. GCC because its default is -ffp-contract=fast, the more
  # aggressive of the two defaults, so a single job gets the stronger check.
  # Highway is deliberately not enabled: this is compiler behaviour, and #381
  # reproduced with no SIMD backend at all.
  #
  # Note this lane would NOT catch #381 today -- those targets now pin
  # -ffp-contract=off. Its value is prospective: the next latent case, such as
  # the long double references tracked in #386.
  #
  # Requires runners at Haswell or newer. All current GitHub-hosted x64 runners
  # qualify; a fleet change would surface here as a build failure, not a flake.
  fp-contract:
    name: Linux x64 FP-contract (x86-64-v3)
    runs-on: ubuntu-24.04

    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release
          -DMTL5_BUILD_EXAMPLES=OFF
          -DCMAKE_CXX_FLAGS="-march=x86-64-v3"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # -- ThreadSanitizer lane: race-check the threading-tagged tests ----------
  # Builds the *_mt tests with -DMTL5_SANITIZE=thread (Clang) and runs them
  # under MTL5_NUM_THREADS=4 to catch data races the plain threaded run can
  # miss. Scoped to the _mt tests to stay cheap. (#299)
  #
  # A NEW *_mt TEST NEEDS NOTHING HERE -- dropping the .cpp into tests/unit/ is
  # enough. The build step asks ctest for the set it is about to run rather than
  # repeating it as a hand-maintained list, which is what that list used to be
  # (#446). The two are trivially easy to desync, and the failure does not look
  # like one: `ctest -R _mt` discovers every _mt test whether or not it was
  # built, so a target missing from the list failed this lane with "Could not
  # find executable" -- reported as a test failure in a ThreadSanitizer job,
  # which reads like a race and is not one.
  tsan:
    name: Linux x64 ThreadSanitizer (mt tests)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure (ThreadSanitizer)
        run: >
          cmake -B build-tsan
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMTL5_SANITIZE=thread
          -DMTL5_BUILD_EXAMPLES=OFF
          -DMTL5_BUILD_BENCHMARKS=OFF

      # `compile_all` gives every test the same name as its target, so the names
      # ctest reports ARE the targets to build. `-N` only enumerates -- it exits
      # 0 on a tree where nothing is built yet, and the "Could not find
      # executable" lines it prints for those are not in the `Test #n: name`
      # form the filter keeps. An empty result means the enumeration broke, and
      # is refused: `cmake --build --target` with no targets builds everything.
      - name: Build mt tests
        run: |
          # An ARRAY, not a word-split string. The string form needed the
          # expansion left unquoted to split into separate --target arguments,
          # which also exposes it to PATHNAME expansion: a target name containing
          # a glob character would be silently replaced by matching filenames, or
          # by nothing. No target name contains one today, so this is hardening
          # rather than a fix -- but the array form gets the splitting without
          # the globbing, so there is no reason to take the risk (#500 review).
          mapfile -t targets < <(
            ctest --test-dir build-tsan -R _mt -N | sed -n 's/^ *Test *#[0-9]*: //p')
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::no _mt tests discovered -- refusing to build the whole tree"
            exit 1
          fi
          echo "discovered _mt targets:" "${targets[@]}"
          cmake --build build-tsan --parallel 2 --target "${targets[@]}"

      - name: Run mt tests under TSan (MTL5_NUM_THREADS=4)
        run: ctest --test-dir build-tsan -R _mt --output-on-failure
        env:
          MTL5_NUM_THREADS: 4
          TSAN_OPTIONS: halt_on_error=1

  # -- Highway SIMD backend: the only lane that compiles it ---------------
  # No other job sets MTL5_WITH_HIGHWAY, so MTL5_HAS_HIGHWAY is never defined
  # and every other lane builds the portable scalar fallback in simd/batch.hpp
  # (size == 1). The Highway specialization -- the actual SIMD register type
  # under the blocked GEMM and SIMD GEMV -- was therefore compiled nowhere,
  # while `-DMTL5_WITH_HIGHWAY=ON` is what the native-fast variant and every
  # published benchmark number use. A lane/masking/FMA-ordering bug there would
  # pass CI and be broken in the builds people actually run (#330).
  #
  # Unlike MTL5_NATIVE_FAST_GEMM -- which tests opt into by #define, so the
  # mult() fast-path dispatch IS covered elsewhere -- this cannot be faked in a
  # test: it needs Highway's headers and library.
  #
  # This lane RUNS the suite, not just builds it. Compile coverage alone would
  # miss numerical divergence between the SIMD and scalar paths, which is the
  # failure mode that matters.
  #
  # Ubuntu 24.04 ships Highway 1.0.7, so find_package(hwy 1.4) misses and
  # FetchContent clones and builds 1.4.0. _deps is cached on the pinned tag so
  # that cost is paid once per cache lifetime rather than every run.
  highway:
    name: Linux x64 Highway SIMD (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc-13
            cxx: g++-13
          - cc: clang-18
            cxx: clang++-18

    # Same trusted-run gate as the build job: forked PRs skip sccache so they
    # cannot poison the shared GHA cache.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Keyed on CMakeLists.txt, which carries the pinned Highway GIT_TAG, so
      # bumping the tag invalidates the cache rather than silently reusing the
      # old checkout.
      - name: Cache the fetched Highway build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-hwy/_deps
          key: highway-${{ runner.os }}-${{ matrix.cxx }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            highway-${{ runner.os }}-${{ matrix.cxx }}-

      # MTL5_NATIVE_ARCH is deliberately NOT set: -march=native would pin the
      # build to whatever microarchitecture the runner happens to be. Highway's
      # static dispatch still compiles its SIMD path at the baseline target,
      # which is what this lane exists to cover.
      - name: Configure
        run: >
          cmake -B build-hwy
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release
          -DMTL5_WITH_HIGHWAY=ON
          -DMTL5_NATIVE_FAST_GEMM=ON

      - name: Build
        run: cmake --build build-hwy --parallel 2

      # Fails loudly if the configure silently fell back to the scalar path --
      # otherwise this lane could go green while covering nothing. The option
      # must be on AND Highway must have actually been built, since a cache
      # restore or a find_package hit are both plausible ways to end up with
      # neither. (simd/test_batch.cpp additionally static-asserts that the batch
      # is wider than one element under MTL5_HAS_HIGHWAY on x86-64, so a silent
      # fallback fails the suite too, not just this step.)
      - name: Verify Highway is actually active
        run: |
          grep -q 'MTL5_WITH_HIGHWAY:BOOL=ON' build-hwy/CMakeCache.txt
          find build-hwy -name 'libhwy*' -print -quit | grep -q .

      - name: Test
        run: ctest --test-dir build-hwy --output-on-failure

  # -- Benchmark sources: build only, never timed -----------------------
  # MTL5_BUILD_BENCHMARKS defaults OFF and no other job enables it, so
  # benchmarks/*.cpp is compiled by no runner. That is how bench_klu.cpp and
  # bench_superlu.cpp came to reference private members of lu_numeric and stayed
  # broken until someone built them locally (#319).
  #
  # This lane only COMPILES them. Timed runs need pinned cores and a quiet
  # machine, which shared runners cannot provide -- absolute perf gates here
  # would be flaky, so the numbers are produced on dedicated hardware and
  # published under docs/benchmarks/ instead.
  #
  # Two configurations, because most of the vendor-comparison code in the
  # scoreboards sits behind #ifdef MTL5_HAS_KLU / MTL5_HAS_SUPERLU and is
  # invisible to a plain build:
  #   native  -- no external libraries (the native-only paths)
  #   vendors -- BLAS/LAPACK + KLU + SuperLU (the guarded comparison paths)
  benchmarks:
    name: Linux x64 benchmarks build (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: native
            cmake_flags: ""
          - config: vendors
            cmake_flags: >-
              -DMTL5_WITH_BLAS=ON -DMTL5_WITH_LAPACK=ON
              -DMTL5_WITH_SUITESPARSE_KLU=ON -DMTL5_WITH_SUPERLU=ON

    # Same trusted-run gate as the build job: forked PRs skip sccache so they
    # cannot poison the shared GHA cache.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install vendor libraries
        if: matrix.config == 'vendors'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libopenblas-dev liblapack-dev libsuitesparse-dev libsuperlu-dev

      - name: Configure
        run: >
          cmake -B build-bench
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release
          -DMTL5_BUILD_BENCHMARKS=ON
          -DMTL5_BUILD_TESTS=OFF
          -DMTL5_BUILD_EXAMPLES=OFF
          ${{ matrix.cmake_flags }}

      - name: Build every benchmark target
        run: >
          cmake --build build-bench --parallel 2
          --target bench_all bench_klu bench_superlu bench_sparse

      # Link/startup check only -- bench_all parses arguments and exits. The
      # other three have no --help and would start a real timed suite, so they
      # are built but not run.
      - name: Smoke check
        run: ./build-bench/benchmarks/bench_all --help

  # ── Tier 2: Regression tests on Linux (~10 min) ─────────────────────
  # Runs only on non-draft PRs, after Tier 1 passes.
  # Exercises dense, sparse, and iterative solvers at 100–50K DOF.
  regression:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    needs: build
    runs-on: ubuntu-24.04

    # Same trusted-run gate as the build job (see note there): forked PRs skip
    # sccache so they cannot poison the shared GHA cache.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure
        run: >
          cmake --preset ci-regression
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}

      - name: Build
        run: cmake --build build-ci-regression --parallel 2

      - name: Run regression tests
        run: >
          ctest --test-dir build-ci-regression
          -L regression
          --output-on-failure
          --timeout 600
