name: CI

# Which events run CI, and which do not.
#
# PUSH runs only for `main` and release tags. A push to a branch that has an open
# PR also fires `pull_request`, so `push: branches: ['**']` built every PR commit
# twice: 20 jobs per event, on 8 platforms. The PR run is the one that tests the
# merge result. To get CI on a branch with no PR,
# open it as a draft (Tier 1 runs on drafts) or run
# `gh workflow run ci.yml --ref <branch>`.
#
# PATHS: a change that touches only documentation runs no CI at all. Nothing
# under docs/ or docs-site/, and no Markdown file, is read by the build or the
# tests; docs.yml builds the site for those changes. The list is repeated
# under both events below, and once more in regression.yml; keep all three
# copies the same. If a PR mixes docs with
# anything else, the whole workflow runs: `paths-ignore` skips a run only when
# EVERY changed file matches. Path filters are not evaluated for tag pushes, so
# a release tag always runs the full matrix.
#
# Nothing in branch protection requires a CI check by name, so a docs-only PR
# that skips CI is still mergeable. If a required check is ever added, a skipped
# workflow leaves it "expected" forever. That would need a gate job that always
# runs, instead of `paths-ignore`.
on:
  push:
    branches: [ main ]
    tags: [ 'v[0-9]*' ]
    paths-ignore:
      - 'docs/**'
      - 'docs-site/**'
      - '**/*.md'
      - '**/*.png'
      - '**/*.svg'
      - 'LICENSE'
      - '.coderabbit.yaml'
      - '.nojekyll'
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'docs-site/**'
      - '**/*.md'
      - '**/*.png'
      - '**/*.svg'
      - 'LICENSE'
      - '.coderabbit.yaml'
      - '.nojekyll'
    # The default types, and deliberately NOT `ready_for_review`. Promoting a
    # draft changes nothing this workflow tests: the head commit already ran
    # here as a draft. Tier 2 lives in regression.yml, which does trigger on
    # `ready_for_review`, so promotion runs the one job that is new instead of
    # all 21 again (~128 runner-minutes per promotion, measured on #609/#610).
    types: [ opened, synchronize, reopened ]

# A new commit on a PR supersedes the run for the previous one: cancel it rather
# than finish a 20-job matrix nobody will read. Pushes to main and tags are keyed
# by commit SHA, so each one gets its own run and none is ever cancelled; main's
# runs also warm the sccache that every PR run reads.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -- ASCII guard: source files must contain only ASCII bytes ---------
  # Fails fast if any C++ source under include/, tests/, examples/
  # introduces non-ASCII (multibyte) characters.
  ascii-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for non-ASCII characters in source
        run: |
          # grep -l exits 0 (matches), 1 (no matches), >1 (execution error).
          # Don't mask >1 with '|| true' — a broken scan must fail CI, not pass.
          set +e
          hits=$(grep -rlP '[^\x00-\x7F]' \
            --include='*.hpp' --include='*.cpp' --include='*.h' \
            --include='*.cc' --include='*.cxx' \
            include tests examples)
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "ASCII scan failed to execute (grep exit $status)."
            exit "$status"
          fi
          if [ -n "$hits" ]; then
            echo "Non-ASCII characters found in:"
            echo "$hits"
            echo "Source files must be ASCII-only. See CONTRIBUTING / issue #59."
            exit 1
          fi
          echo "OK: all source files are ASCII-only."

  # Every committed CSV must carry its .sysinfo (#477). A benchmark result
  # without provenance cannot be traced to a commit, a build configuration or a
  # machine state -- 28 such files reached the repository before anyone noticed,
  # and they were found by auditing an open issue rather than by anything
  # failing. Those are grandfathered in benchmarks/data/.sidecar-exempt; this
  # job forbids adding another, and also fails on a stale exemption so the list
  # cannot rot into a permanent amnesty.
  sidecar-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every committed CSV has a provenance sidecar
        run: benchmarks/check_sidecars.sh

  # -- Tier 1: Fast unit tests on all platforms (~2 min) ---------------
  # Runs on every PR (draft or ready) and every push to main, unless the change
  # is documentation only (see `on:` above).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            name: Linux x64 (GCC 13)

          - os: ubuntu-24.04
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            name: Linux x64 (Clang 18)

          # ── Linux ARM64 ───────────────────────────────────────────────
          - os: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            name: Linux ARM64 (GCC 13)

          - os: ubuntu-24.04-arm
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            name: Linux ARM64 (Clang 18)

          # ── macOS ARM64 (Apple Silicon) ───────────────────────────────
          # macOS 14 images are retired on 2026-11-02 (actions/runner-images#13518).
          - os: macos-15
            compiler: apple-clang
            cc: clang
            cxx: clang++
            name: macOS ARM64 (Apple Clang)

          - os: macos-26
            compiler: apple-clang
            cc: clang
            cxx: clang++
            name: macOS ARM64 (Apple Clang, latest)

          # ── Windows x86_64 ────────────────────────────────────────────
          - os: windows-2022
            compiler: msvc
            name: Windows x64 (MSVC 2022)

          - os: windows-2022
            compiler: clang-cl
            name: Windows x64 (Clang-CL)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # Use sccache (and its GitHub Actions cache) only on trusted runs: pushes
    # and same-repo PRs. Forked PRs leave it empty so they never write to the
    # shared GHA cache (zizmor cache-poisoning). An empty launcher == no launcher.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Report whether the Linux ARM64 runner has SVE (#427). batch<T> demotes a
      # scalable target to one lane, so whether SVE work can be tested here --
      # or needs other hardware -- depends on what this runner reports. Shown as
      # a check annotation; informational only, it never fails the job.
      - name: Report SIMD features (Linux ARM64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        env:
          CXX_UNDER_TEST: ${{ matrix.cxx }}
        run: |
          model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          feats=$(grep -m1 '^Features' /proc/cpuinfo | cut -d: -f2)
          sve=no; sve2=no
          for f in $feats; do
            [ "$f" = sve ] && sve=yes
            [ "$f" = sve2 ] && sve2=yes
          done
          vl=$(cat /proc/sys/abi/sve_default_vector_length 2>/dev/null || echo n/a)
          native=$("$CXX_UNDER_TEST" -march=native -dM -E -x c++ /dev/null 2>/dev/null \
                     | grep -c '__ARM_FEATURE_SVE ' || true)
          echo "CPU: ${model:-unknown}"
          echo "Features:$feats"
          echo "::notice title=ARM64 SIMD (#427)::cpu=${model:-unknown} sve=$sve sve2=$sve2 default_vl_bytes=$vl native_sve_macro=$native"

      - name: Configure (Unix, GCC/Clang)
        if: runner.os != 'Windows'
        run: >
          cmake -B build
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows, MSVC)
        if: matrix.compiler == 'msvc'
        run: >
          cmake -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}

      - name: Configure (Windows, Clang-CL)
        if: matrix.compiler == 'clang-cl'
        run: >
          cmake -B build
          -G "Visual Studio 17 2022" -A x64
          -T ClangCL
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel 2

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

  # -- LAPACK/BLAS-enabled build: exercises the geev/syev dispatch -----
  # Linux GCC + Clang with -DMTL5_WITH_LAPACK=ON so the external-library
  # dispatch paths (general geev, symmetric syev) are compiled and run; the
  # default matrix above builds without LAPACK and takes the in-house paths.
  # The BLIS entry links BLIS (BLAS only: LAPACK would come from libflame) with
  # the pool threaded, so a vendor call inside an MTL5 region is run, and
  # checked, on one thread (#640); OpenBLAS has no per-thread control to check.
  # It runs on Ubuntu 26.04 for BLIS 1.x: 24.04's BLIS 0.9 has only a
  # process-wide setting, which MTL5 does not cap.
  # The OpenBLAS entries also link SuperLU, so the suite -- the umbrella
  # header and iface_test_superlu_blas among it -- is built with BLAS and
  # SuperLU in one translation unit; SuperLU's own BLAS prototypes used to
  # conflict with MTL5's there (#725).
  lapack:
    name: Linux x64 LAPACK (${{ matrix.cxx }}${{ matrix.vendor && format(', {0}', matrix.vendor) || '' }})
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc-13
            cxx: g++-13
            packages: liblapack-dev libopenblas-dev libsuperlu-dev
            cmake_extra: -DMTL5_WITH_LAPACK=ON -DMTL5_WITH_SUPERLU=ON
          - cc: clang-18
            cxx: clang++-18
            packages: liblapack-dev libopenblas-dev libsuperlu-dev
            cmake_extra: -DMTL5_WITH_LAPACK=ON -DMTL5_WITH_SUPERLU=ON
          - cc: gcc
            cxx: g++
            os: ubuntu-26.04
            vendor: BLIS
            packages: libblis-openmp-dev
            cmake_extra: -DBLA_VENDOR=FLAME
            threads: 4

    # Same trusted-run gate as the build job: forked PRs skip sccache so they
    # cannot poison the shared GHA cache.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install LAPACK/BLAS
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release
          -DMTL5_WITH_BLAS=ON
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          MTL5_NUM_THREADS: ${{ matrix.threads || '' }}
          BLIS_NUM_THREADS: ${{ matrix.threads || '' }}
        run: ctest --test-dir build --output-on-failure

  # -- Threaded lane: run the suite with the pool actually multithreaded ----
  # Same Release build as the default job, but ctest runs with
  # MTL5_NUM_THREADS=4 so detail::thread_pool sizes to a real team and the
  # pool-based kernels (mult/gemv/dot/nrm2/axpy/scal, sparse SpMV, the dense
  # factorization updates, Householder application, sparse triangular solve)
  # actually run multithreaded -- the default job runs them serial. The
  # deterministic kernels are bit-identical across thread counts, so pass/fail
  # must match serial; a divergence is a real race/chunking bug this lane
  # surfaces. Runs on every PR (incl. drafts) and push to main, like the build job. (#299)
  threaded:
    name: Linux x64 threaded (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc-13
            cxx: g++-13
          - cc: clang-18
            cxx: clang++-18

    # Same trusted-run gate as the build job: forked PRs skip sccache so they
    # cannot poison the shared GHA cache.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test (MTL5_NUM_THREADS=4)
        run: ctest --test-dir build --output-on-failure
        env:
          MTL5_NUM_THREADS: 4

  # -- Fixed-baseline FP-contraction lane ----------------------------------
  # No other test lane compiles with an elevated ISA baseline, so no test lane
  # enables FP contraction -- while the release preset and the benchmark lanes
  # do. The configuration a performance-minded user is most likely to build is
  # the one the suite never ran in, and #381 was found by hand because of it.
  #
  # x86-64-v3 (AVX2 + FMA), NOT -march=native. native would pin the build to
  # whatever microarchitecture the runner happens to be, so a red result would
  # not be reproducible; v3 is a fixed target that still enables the contraction
  # this lane exists to exercise. Verified equivalent for the purpose: with the
  # #381 contraction pin removed, v3 reproduces that failure exactly -- 4
  # assertions in trisolve_level_schedule_mt and 1 in supernodal_ldlt_mt, the
  # same counts -march=native gives.
  #
  # Release, because contraction is an optimizer transformation and -O0 would
  # not exercise it. GCC because its default is -ffp-contract=fast, the more
  # aggressive of the two defaults, so a single job gets the stronger check.
  # Highway is deliberately not enabled: this is compiler behaviour, and #381
  # reproduced with no SIMD backend at all.
  #
  # Note this lane would NOT catch #381 today -- those targets now pin
  # -ffp-contract=off. Its value is prospective: the next latent case, such as
  # the long double references tracked in #386.
  #
  # Requires runners at Haswell or newer. All current GitHub-hosted x64 runners
  # qualify; a fleet change would surface here as a build failure, not a flake.
  fp-contract:
    name: Linux x64 FP-contract (x86-64-v3)
    runs-on: ubuntu-24.04

    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release
          -DMTL5_BUILD_EXAMPLES=OFF
          -DCMAKE_CXX_FLAGS="-march=x86-64-v3"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # -- ThreadSanitizer lane: race-check the threading-tagged tests ----------
  # Builds the *_mt tests with -DMTL5_SANITIZE=thread (Clang) and runs them
  # under MTL5_NUM_THREADS=4 to catch data races the plain threaded run can
  # miss. Scoped to the _mt tests to stay cheap. (#299)
  #
  # A NEW *_mt TEST NEEDS NOTHING HERE -- dropping the .cpp into tests/unit/ is
  # enough. The build step asks ctest for the set it is about to run rather than
  # repeating it as a hand-maintained list, which is what that list used to be
  # (#446). The two are trivially easy to desync, and the failure does not look
  # like one: `ctest -R _mt` discovers every _mt test whether or not it was
  # built, so a target missing from the list failed this lane with "Could not
  # find executable" -- reported as a test failure in a ThreadSanitizer job,
  # which reads like a race and is not one.
  tsan:
    name: Linux x64 ThreadSanitizer (mt tests)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure (ThreadSanitizer)
        run: >
          cmake -B build-tsan
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMTL5_SANITIZE=thread
          -DMTL5_BUILD_EXAMPLES=OFF
          -DMTL5_BUILD_BENCHMARKS=OFF

      # `compile_all` gives every test the same name as its target, so the names
      # ctest reports ARE the targets to build. `-N` only enumerates -- it exits
      # 0 on a tree where nothing is built yet, and the "Could not find
      # executable" lines it prints for those are not in the `Test #n: name`
      # form the filter keeps. An empty result means the enumeration broke, and
      # is refused: `cmake --build --target` with no targets builds everything.
      - name: Build mt tests
        run: |
          # An ARRAY, not a word-split string. The string form needed the
          # expansion left unquoted to split into separate --target arguments,
          # which also exposes it to PATHNAME expansion: a target name containing
          # a glob character would be silently replaced by matching filenames, or
          # by nothing. No target name contains one today, so this is hardening
          # rather than a fix -- but the array form gets the splitting without
          # the globbing, so there is no reason to take the risk (#500 review).
          mapfile -t targets < <(
            ctest --test-dir build-tsan -R _mt -N | sed -n 's/^ *Test *#[0-9]*: //p')
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::no _mt tests discovered -- refusing to build the whole tree"
            exit 1
          fi
          echo "discovered _mt targets:" "${targets[@]}"
          cmake --build build-tsan --parallel 2 --target "${targets[@]}"

      - name: Run mt tests under TSan (MTL5_NUM_THREADS=4)
        run: ctest --test-dir build-tsan -R _mt --output-on-failure
        env:
          MTL5_NUM_THREADS: 4
          TSAN_OPTIONS: halt_on_error=1

  # -- Highway SIMD backend: the only lanes that compile it ---------------
  # No other job sets MTL5_WITH_HIGHWAY, so MTL5_HAS_HIGHWAY is never defined
  # and every other lane builds the portable scalar fallback in simd/batch.hpp
  # (size == 1). The Highway specialization -- the actual SIMD register type
  # under the blocked GEMM and SIMD GEMV -- was therefore compiled nowhere,
  # while `-DMTL5_WITH_HIGHWAY=ON` is what the native-fast variant and every
  # published benchmark number use. A lane/masking/FMA-ordering bug there would
  # pass CI and be broken in the builds people actually run (#330).
  #
  # Unlike MTL5_NATIVE_FAST_GEMM -- which tests opt into by #define, so the
  # mult() fast-path dispatch IS covered elsewhere -- this cannot be faked in a
  # test: it needs Highway's headers and library.
  #
  # These lanes RUN the suite, not just build it. Compile coverage alone would
  # miss numerical divergence between the SIMD and scalar paths, which is the
  # failure mode that matters.
  #
  # ARM64 (#717). The ubuntu-24.04-arm runners are Neoverse N2: NEON, SVE and
  # SVE2 at a 128-bit vector length (the #427 probe in the build job reports
  # it). Three ARM targets, because MTL5 does three different things on them
  # (docs/performance/arm64-simd-neon-sve.md):
  #   neon      the default build; Highway's NEON_WITHOUT_AES baseline.
  #   sve2-128  -msve-vector-bits=128: real SVE2 code with a compile-time lane
  #             count, which batch stores as a fixed-length ACLE type. The
  #             binary is correct only where the SVE vector length is 128 bits,
  #             so the lane refuses to run anywhere else. -mcpu=neoverse-n2,
  #             not -march=armv9-a: Highway compiles SVE2_128 with +i8mm,+bf16
  #             and armv9-a lacks them ("target specific option mismatch").
  #             GCC only: Highway 1.4.0 marks SVE2_128 broken before Clang 21.
  #   native    MTL5_NATIVE_ARCH=ON, i.e. -march=native. With GCC on N2 that is
  #             SCALABLE SVE2, which batch demotes to one lane: a native build
  #             has no SIMD at all. Pinned (test_batch asserts size == 1) so it
  #             cannot change unnoticed; #427 flips it. Only the SIMD tests run:
  #             the rest of the suite on the scalar path is what the plain
  #             ARM64 build job already covers.
  # Every lane names the Highway target it exists to cover, and test_batch
  # fails to COMPILE on any other (MTL5_TEST_EXPECT_HWY_TARGET), so a lane
  # cannot go green while testing the wrong code.
  #
  # Ubuntu 24.04 ships Highway 1.0.7, so find_package(hwy 1.4) misses and
  # FetchContent clones and builds 1.4.0. _deps is cached on the pinned tag so
  # that cost is paid once per cache lifetime rather than every run.
  highway:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 Highway SIMD (g++-13)
            os: ubuntu-24.04
            lane: baseline
            cc: gcc-13
            cxx: g++-13
          - name: Linux x64 Highway SIMD (clang++-18)
            os: ubuntu-24.04
            lane: baseline
            cc: clang-18
            cxx: clang++-18
          - name: Linux ARM64 Highway NEON (g++-13)
            os: ubuntu-24.04-arm
            lane: neon
            cc: gcc-13
            cxx: g++-13
            cxx_flags: -DMTL5_TEST_EXPECT_HWY_TARGET=HWY_NEON_WITHOUT_AES
          - name: Linux ARM64 Highway NEON (clang++-18)
            os: ubuntu-24.04-arm
            lane: neon
            cc: clang-18
            cxx: clang++-18
            cxx_flags: -DMTL5_TEST_EXPECT_HWY_TARGET=HWY_NEON_WITHOUT_AES
          - name: Linux ARM64 Highway SVE2_128 (g++-13)
            os: ubuntu-24.04-arm
            lane: sve2-128
            cc: gcc-13
            cxx: g++-13
            cxx_flags: >-
              -mcpu=neoverse-n2 -msve-vector-bits=128
              -DMTL5_TEST_EXPECT_HWY_TARGET=HWY_SVE2_128
            require_sve_vl_bytes: 16
          - name: Linux ARM64 Highway native, scalable SVE2 (g++-13)
            os: ubuntu-24.04-arm
            lane: native
            cc: gcc-13
            cxx: g++-13
            cxx_flags: -DMTL5_TEST_EXPECT_HWY_TARGET=HWY_SVE2
            cmake_args: -DMTL5_NATIVE_ARCH=ON
            require_sve2: true
            simd_tests_only: true

    # Same trusted-run gate as the build job: forked PRs skip sccache so they
    # cannot poison the shared GHA cache.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A lane whose code is only valid on certain hardware checks the runner
      # first, so a change of runner fleet fails here, by name, instead of as
      # wrong answers from code compiled for a vector length the machine lacks.
      - name: Check the runner supports this lane's target
        if: matrix.require_sve_vl_bytes || matrix.require_sve2
        env:
          REQUIRE_VL: ${{ matrix.require_sve_vl_bytes }}
          REQUIRE_SVE2: ${{ matrix.require_sve2 }}
        run: |
          feats=" $(grep -m1 '^Features' /proc/cpuinfo | cut -d: -f2) "
          vl=$(cat /proc/sys/abi/sve_default_vector_length 2>/dev/null || echo none)
          echo "SVE default vector length (bytes): $vl"
          case "$feats" in *" sve2 "*) ;; *)
            echo "::error::this lane needs SVE2; the runner has: $feats"; exit 1 ;;
          esac
          if [ -n "$REQUIRE_VL" ] && [ "$vl" != "$REQUIRE_VL" ]; then
            echo "::error::this lane's binary is built for a $REQUIRE_VL-byte SVE vector; the runner's is $vl"
            exit 1
          fi

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Keyed on CMakeLists.txt, which carries the pinned Highway GIT_TAG, so
      # bumping the tag invalidates the cache rather than silently reusing the
      # old checkout. Also keyed on the architecture and the lane: runner.os is
      # "Linux" on both x64 and ARM64, and each lane builds Highway with its own
      # flags.
      - name: Cache the fetched Highway build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-hwy/_deps
          key: highway-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ matrix.cxx }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            highway-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ matrix.cxx }}-

      # MTL5_NATIVE_ARCH is deliberately NOT set outside the `native` lane:
      # -march=native would pin the build to whatever microarchitecture the
      # runner happens to be. Highway's static dispatch still compiles its SIMD
      # path at the baseline target, which is what the baseline lanes cover.
      - name: Configure
        env:
          LANE_CXX_FLAGS: ${{ matrix.cxx_flags }}
          LANE_CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: >
          cmake -B build-hwy
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="$LANE_CXX_FLAGS"
          -DMTL5_WITH_HIGHWAY=ON
          -DMTL5_NATIVE_FAST_GEMM=ON
          $LANE_CMAKE_ARGS

      - name: Build
        env:
          SIMD_TESTS_ONLY: ${{ matrix.simd_tests_only }}
        run: |
          if [ "$SIMD_TESTS_ONLY" = true ]; then
            targets=()
            for f in tests/unit/simd/*.cpp; do
              targets+=("simd_$(basename "$f" .cpp)")
            done
            cmake --build build-hwy --parallel 2 --target "${targets[@]}"
          else
            cmake --build build-hwy --parallel 2
          fi

      # Fails loudly if the configure silently fell back to the scalar path --
      # otherwise this lane could go green while covering nothing. The option
      # must be on AND Highway must have actually been built, since a cache
      # restore or a find_package hit are both plausible ways to end up with
      # neither. (simd/test_batch.cpp additionally static-asserts that the batch
      # is wider than one element under MTL5_HAS_HIGHWAY on x86-64 and AArch64,
      # and that the target is the lane's MTL5_TEST_EXPECT_HWY_TARGET, so a
      # silent fallback fails the build too, not just this step.)
      - name: Verify Highway is actually active
        run: |
          grep -q 'MTL5_WITH_HIGHWAY:BOOL=ON' build-hwy/CMakeCache.txt
          find build-hwy -name 'libhwy*' -print -quit | grep -q .

      - name: Report the compiled SIMD target
        env:
          LANE_NAME: ${{ matrix.name }}
        run: |
          bin=$(find build-hwy -type f -name simd_test_batch -perm -u+x -print -quit)
          line=$("$bin" "report the compiled SIMD backend" | grep -m1 'hwy=' || true)
          echo "$line"
          echo "::notice title=Highway target ($LANE_NAME)::${line:-not reported}"

      - name: Test
        env:
          SIMD_TESTS_ONLY: ${{ matrix.simd_tests_only }}
        run: |
          if [ "$SIMD_TESTS_ONLY" = true ]; then
            ctest --test-dir build-hwy -R '^simd_' --output-on-failure
          else
            ctest --test-dir build-hwy --output-on-failure
          fi

  # -- Benchmark sources: build only, never timed -----------------------
  # MTL5_BUILD_BENCHMARKS defaults OFF and no other job enables it, so
  # benchmarks/*.cpp is compiled by no runner. That is how bench_klu.cpp and
  # bench_superlu.cpp came to reference private members of lu_numeric and stayed
  # broken until someone built them locally (#319).
  #
  # This lane only COMPILES them. Timed runs need pinned cores and a quiet
  # machine, which shared runners cannot provide -- absolute perf gates here
  # would be flaky, so the numbers are produced on dedicated hardware and
  # published under docs/benchmarks/ instead.
  #
  # Two configurations, because most of the vendor-comparison code in the
  # scoreboards sits behind #ifdef MTL5_HAS_KLU / MTL5_HAS_SUPERLU and is
  # invisible to a plain build:
  #   native  -- no external libraries (the native-only paths)
  #   vendors -- BLAS/LAPACK + KLU + SuperLU (the guarded comparison paths)
  benchmarks:
    name: Linux x64 benchmarks build (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: native
            cmake_flags: ""
          - config: vendors
            cmake_flags: >-
              -DMTL5_WITH_BLAS=ON -DMTL5_WITH_LAPACK=ON
              -DMTL5_WITH_SUITESPARSE_KLU=ON -DMTL5_WITH_SUPERLU=ON

    # Same trusted-run gate as the build job: forked PRs skip sccache so they
    # cannot poison the shared GHA cache.
    env:
      SCCACHE_LAUNCHER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install vendor libraries
        if: matrix.config == 'vendors'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libopenblas-dev liblapack-dev libsuitesparse-dev libsuperlu-dev

      - name: Configure
        run: >
          cmake -B build-bench
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.SCCACHE_LAUNCHER }}
          -DCMAKE_BUILD_TYPE=Release
          -DMTL5_BUILD_BENCHMARKS=ON
          -DMTL5_BUILD_TESTS=OFF
          -DMTL5_BUILD_EXAMPLES=OFF
          ${{ matrix.cmake_flags }}

      - name: Build every benchmark target
        run: >
          cmake --build build-bench --parallel 2
          --target bench_all bench_klu bench_superlu bench_sparse mtl5_bench

      # Link/startup check only -- bench_all parses arguments and exits. The
      # other three have no --help and would start a real timed suite, so they
      # are built but not run.
      - name: Smoke check
        run: ./build-bench/benchmarks/bench_all --help

      # mtl5_bench promises to measure ALL of MTL5 (#721 M7). Every header in the
      # operation, solver, preconditioner, factorization and ordering
      # directories must be mapped in benchmarks/platform/coverage.txt to the
      # entry that measures it, or to a written exemption, and every entry it
      # names must exist in this binary's --list.
      - name: Registry coverage
        run: benchmarks/check_coverage.sh ./build-bench/benchmarks/mtl5_bench

  # -- Platform benchmark: the one command, on every OS (#721 M2) ---------
  # benchmarks/platform.sh (platform.ps1 on Windows) is what a new machine runs:
  # preflight, build mtl5_bench per variant, run it at each thread count, write
  # JSON + sidecars + capability cards. This job runs exactly that, end to end,
  # at the `small` class, so the scripts and every result check are exercised
  # on each OS and both architectures. Shared runners cannot time anything
  # (docs/performance/benchmarking-methodology.md), so nothing here gates on a
  # rate -- only on the builds and the correctness checks (exit status).
  #
  # --no-gate: a shared runner fails preflight's machine-state gates (governor,
  # load), which exist for real measurements; the state is still recorded.
  # The results go to the default build-platform/results/, which is gitignored,
  # so the run cannot dirty the tree that preflight checks.
  platform:
    name: Platform benchmark smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
          - os: ubuntu-24.04-arm
            name: Linux ARM64
          - os: macos-15
            name: macOS ARM64
          - os: windows-2022
            name: Windows x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run platform.sh (class small)
        if: runner.os != 'Windows'
        run: >
          benchmarks/platform.sh --class small --variants native,native-fast
          --threads 1,2 --jobs 2 --no-gate

      - name: Run platform.ps1 (class small)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          ./benchmarks/platform.ps1 -Class small -Variants native,native-fast
          -Threads 1,2 -Jobs 2 -NoGate

      # Publish the session into this throwaway checkout and check the result,
      # so publish_platform.cmake runs on every OS against real platform
      # output (#758). The machine name only has to be one systems.md knows.
      # ALLOW_DIRTY: this step tests the script's mechanics, not the runner's
      # checkout. check_sidecars.sh needs bash 4, which macOS does not ship.
      - name: Publish the session (publish_platform.cmake)
        shell: bash
        run: |
          results=$(ls -d build-platform/results/*/ | head -1)
          results=${results%/}
          cmake "-DRESULTS=$results" -DMACHINE=i7-12700k -DPRELIMINARY=ON -DALLOW_DIRTY=ON \
                -P benchmarks/publish_platform.cmake
          data=benchmarks/data/i7-12700k/mtl5_bench
          session=$(ls "$data")
          ls -l "$data/$session"
          for f in native-t1 native-t2 native-fast-t1 native-fast-t2; do
            test -f "$data/$session/$f.json" && test -f "$data/$session/$f.json.sysinfo" && test -f "$data/$session/$f.md"
          done
          grep -q '^# mtl5_bench capability card -- i7-12700k' docs/benchmarks/i7-12700k-mtl5-bench.md
          grep -q "^| session | \`$session\` (UTC) |" docs/benchmarks/i7-12700k-mtl5-bench.md
          grep -q "'benchmarks/i7-12700k-mtl5-bench.md'" docs-site/sync-content.mjs
          if [ "$RUNNER_OS" != macOS ]; then benchmarks/check_sidecars.sh; fi
          # Publishing the same session again is a no-op.
          cmake "-DRESULTS=$results" -DMACHINE=i7-12700k -DPRELIMINARY=ON -DALLOW_DIRTY=ON \
                -P benchmarks/publish_platform.cmake | tee publish2.log
          grep -q 'already published with identical files' publish2.log

      - name: Show the capability cards and logs
        if: always()
        shell: bash
        run: |
          for f in build-platform/results/*/summary.md; do
            [ -f "$f" ] && cat "$f"
          done
          # Configure and build logs are long; their tails hold any error.
          for f in build-platform/results/*/logs/*; do
            echo "::group::$f"
            case "$f" in *.configure*|*.build*) tail -n 60 "$f" ;; *) cat "$f" ;; esac
            echo "::endgroup::"
          done
