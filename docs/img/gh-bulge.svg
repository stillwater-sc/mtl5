<g opacity="1"><animate attributeName="opacity" calcMode="discrete" dur="17.6s" repeatCount="indefinite" values="1;0" keyTimes="0;0.090909"/><text class="ink" x="320" y="100" font-size="13" text-anchor="start">upper bidiagonal B</text><text class="muted" x="320" y="126" font-size="12" text-anchor="start">rotations so far: 0</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="17.6s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.090909;0.181818"/><text class="ink" x="320" y="100" font-size="13" text-anchor="start">right rotation, columns 1 and 2: shift enters, bulge at (2, 1)</text><text class="muted" x="320" y="126" font-size="12" text-anchor="start">rotations so far: 1</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="17.6s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.181818;0.272727"/><text class="ink" x="320" y="100" font-size="13" text-anchor="start">left rotation, rows 1 and 2: zero (2, 1), bulge at (1, 3)</text><text class="muted" x="320" y="126" font-size="12" text-anchor="start">rotations so far: 2</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="17.6s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.272727;0.363636"/><text class="ink" x="320" y="100" font-size="13" text-anchor="start">right rotation, columns 2 and 3: zero (1, 3), bulge at (3, 2)</text><text class="muted" x="320" y="126" font-size="12" text-anchor="start">rotations so far: 3</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="17.6s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.363636;0.454545"/><text class="ink" x="320" y="100" font-size="13" text-anchor="start">left rotation, rows 2 and 3: zero (3, 2), bulge at (2, 4)</text><text class="muted" x="320" y="126" font-size="12" text-anchor="start">rotations so far: 4</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="17.6s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.454545;0.545455"/><text class="ink" x="320" y="100" font-size="13" text-anchor="start">right rotation, columns 3 and 4: zero (2, 4), bulge at (4, 3)</text><text class="muted" x="320" y="126" font-size="12" text-anchor="start">rotations so far: 5</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="17.6s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.545455;0.636364"/><text class="ink" x="320" y="100" font-size="13" text-anchor="start">left rotation, rows 3 and 4: zero (4, 3), bulge at (3, 5)</text><text class="muted" x="320" y="126" font-size="12" text-anchor="start">rotations so far: 6</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="17.6s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.636364;0.727273"/><text class="ink" x="320" y="100" font-size="13" text-anchor="start">right rotation, columns 4 and 5: zero (3, 5), bulge at (5, 4)</text><text class="muted" x="320" y="126" font-size="12" text-anchor="start">rotations so far: 7</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="17.6s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.727273;0.818182"/><text class="ink" x="320" y="100" font-size="13" text-anchor="start">left rotation, rows 4 and 5: zero (5, 4), bidiagonal again</text><text class="muted" x="320" y="126" font-size="12" text-anchor="start">rotations so far: 8</text></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="17.6s" repeatCount="indefinite" values="0;1" keyTimes="0;0.818182"/><text class="ink" x="320" y="100" font-size="13" text-anchor="start">one step done: the last superdiagonal entry shrinks</text><text class="muted" x="320" y="126" font-size="12" text-anchor="start">rotations so far: 8</text></g>
<text class="muted" x="320" y="190" font-size="12" text-anchor="start">Each rotation zeroes the bulge the previous one made</text>
<text class="muted" x="320" y="210" font-size="12" text-anchor="start">and makes a new one one place further down.</text>
<text class="muted" x="320" y="230" font-size="12" text-anchor="start">An n x n step costs 2(n − 1) rotations, O(n) work.</text>
<text class="muted" x="320" y="250" font-size="12" text-anchor="start">The Francis step on a Hessenberg matrix chases its</text>
<text class="muted" x="320" y="270" font-size="12" text-anchor="start">bulge the same way, with 3 x 3 reflectors.</text>
<rect class="nz" x="70" y="320" width="14" height="14" rx="3"/>
<text class="muted" x="90" y="332" font-size="12" text-anchor="start">band entry</text>
<rect class="fill" x="230" y="320" width="14" height="14" rx="3"/>
<text class="muted" x="250" y="332" font-size="12" text-anchor="start">bulge</text>
<rect class="gone" x="390" y="320" width="14" height="14" rx="3"/>
<text class="muted" x="410" y="332" font-size="12" text-anchor="start">just zeroed</text>
<rect class="band" x="550" y="320" width="14" height="14" rx="3"/>
<text class="muted" x="570" y="332" font-size="12" text-anchor="start">rows or columns rotated</text>
</svg>
