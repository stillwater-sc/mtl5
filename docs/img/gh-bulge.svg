<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img">
<title>Chasing the bulge in a Golub-Kahan SVD step</title>
<desc>A 5 by 5 upper bidiagonal matrix. Alternating right and left Givens rotations push a single nonzero, the bulge, down and to the right until it falls off the matrix and the matrix is bidiagonal again.</desc>
<style>
  .bg    { fill: #fbfbfd; stroke: #d0d4dc; }
  .ink   { fill: #1f2430; }
  .muted { fill: #6b7280; }
  .line  { stroke: #1f2430; fill: none; }
  .axis  { stroke: #9aa1ad; fill: none; }
  .guide { stroke: #9aa1ad; fill: none; stroke-dasharray: 4 4; }
  .vec   { stroke: #2563eb; fill: none; }
  .vecf  { fill: #2563eb; }
  .ghost { stroke: #93b4f5; fill: none; }
  .mirror{ stroke: #c2410c; fill: none; stroke-dasharray: 6 4; }
  .accent{ fill: #c2410c; }
  .accs  { stroke: #c2410c; fill: none; }
  .nz    { fill: #3b6fd8; }
  .fill  { fill: #e8892c; }
  .gone  { fill: #f3c1c1; }
  .zero  { fill: #ffffff; stroke: #d7dbe3; }
  .band  { fill: #fde68a; }
  .s0 { stroke: #2563eb; } .s1 { stroke: #c2410c; }
  .s2 { stroke: #059669; } .s3 { stroke: #7c3aed; }
  .f0 { fill: #2563eb; } .f1 { fill: #c2410c; }
  .f2 { fill: #059669; } .f3 { fill: #7c3aed; }
  text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #171a21; stroke: #343a46; }
    .ink   { fill: #e6e8ee; }
    .muted { fill: #9aa1ad; }
    .line  { stroke: #e6e8ee; }
    .axis  { stroke: #5b6270; }
    .guide { stroke: #5b6270; }
    .vec   { stroke: #6ea0ff; }
    .vecf  { fill: #6ea0ff; }
    .ghost { stroke: #3c5a99; }
    .mirror{ stroke: #f08a4b; }
    .accent{ fill: #f08a4b; }
    .accs  { stroke: #f08a4b; }
    .nz    { fill: #5b8cf0; }
    .fill  { fill: #f0a050; }
    .gone  { fill: #6b3a3a; }
    .zero  { fill: #1f232c; stroke: #343a46; }
    .band  { fill: #5c4a12; }
    .s0 { stroke: #6ea0ff; } .s1 { stroke: #f08a4b; }
    .s2 { stroke: #34d399; } .s3 { stroke: #b28cff; }
    .f0 { fill: #6ea0ff; } .f1 { fill: #f08a4b; }
    .f2 { fill: #34d399; } .f3 { fill: #b28cff; }
  }
</style>
